name: build.yml
on: [workflow_dispatch, push]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
        java-dist: [ temurin, semeru ]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: ${{ matrix.java-dist }}
          cache: maven
      - run: |
          mvn verify
